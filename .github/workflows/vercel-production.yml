name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel deploy hook configuration
        id: hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not configured yet. Vercel deployment trigger was skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel production deployment
        if: steps.hook.outputs.configured == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "Vercel production deployment triggered for main."
